name: Atualizar dados e publicar

on:
  schedule:
    - cron: "*/30 * * * *"      # de 30 em 30 minutos: só segue se for dia de jogo
    - cron: "7 3,9,15,21 * * *" # de 6 em 6 horas (0h07, 6h07, 12h07 e 18h07 em Brasília): segue sempre
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.commit.outputs.mudou == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dia de jogo?
        id: agenda
        run: |
          if [ "${{ github.event.schedule }}" = "*/30 * * * *" ]; then
            npm run --silent deve-rodar >> "$GITHUB_OUTPUT"
          else
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Testes do modelo
        if: steps.agenda.outputs.rodar == 'true'
        run: npm test

      - name: Buscar e validar dados
        if: steps.agenda.outputs.rodar == 'true' && github.event_name != 'push'
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: npm run update-data

      - name: Commit dos dados
        id: commit
        if: steps.agenda.outputs.rodar == 'true'
        run: |
          if git diff --quiet -- data; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Dados: $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            git push
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: dados
    if: needs.dados.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # pega o commit de dados que acabou de ser feito

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run escudos

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
