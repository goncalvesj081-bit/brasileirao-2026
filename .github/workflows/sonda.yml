# Temporário: testa se a ESPN libera o placar para o navegador (CORS). Apagar depois.
name: Sonda de fontes
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Testar
        run: |
          set +e
          U="https://site.api.espn.com/apis/site/v2/sports/soccer/bra.1/scoreboard?dates=20261018"
          echo "== cabecalhos"; curl -s -D - -o out.json -H "Origin: https://goncalvesj081-bit.github.io" "$U" | grep -i "access-control\|cache-control\|^HTTP"
          echo "== jogos de hoje"; jq -c '[.events[] | {n: .shortName, st: .status.type.name, clock: .status.displayClock, det: .status.type.detail, h: .competitions[0].competitors[0] | {ha: .homeAway, s: .score, t: .team.displayName}}]' out.json | cut -c1-2000
