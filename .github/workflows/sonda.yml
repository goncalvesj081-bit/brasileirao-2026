# Temporário: testa fontes da Série B. Apagar depois.
name: Sonda de fontes
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Testar
        run: |
          set +e
          UA="brasileirao-2026 (github.com/goncalvesj081-bit/brasileirao-2026)"
          T="2026_Campeonato_Brasileiro_S%C3%A9rie_B"
          for S in 6 9 10; do
            echo "== en secao $S"; curl -s -A "$UA" "https://en.wikipedia.org/w/api.php?action=parse&page=$T&prop=wikitext&section=$S&format=json&formatversion=2" | jq -r '.parse.wikitext' | grep -v "^|.*cite\|^<ref" | head -c 3500; echo
          done
          P="Campeonato_Brasileiro_de_Futebol_de_2026_-_S%C3%A9rie_B"
          echo "== pt secoes"; curl -s -A "$UA" "https://pt.wikipedia.org/w/api.php?action=parse&page=$P&prop=sections&format=json&redirects=1" | jq -c '[.parse.sections[] | {i: .index, l: .line}]'
          S=$(curl -s -A "$UA" "https://pt.wikipedia.org/w/api.php?action=parse&page=$P&prop=sections&format=json&redirects=1" | jq -r '[.parse.sections[] | select(.line|test("Regulamento|Formato|Disputa"))][0].index')
          echo "== pt regulamento $S"; curl -s -A "$UA" "https://pt.wikipedia.org/w/api.php?action=parse&page=$P&prop=wikitext&section=$S&format=json&formatversion=2&redirects=1" | jq -r '.parse.wikitext' | head -c 3000
          E=https://site.api.espn.com/apis/site/v2/sports/soccer/bra.2
          echo "== jogos por mes"; for m in 202603 202604 202605 202606 202607 202608 202609 202610 202611 202612; do echo -n "$m "; curl -s "$E/scoreboard?dates=$m&limit=500" | jq -c '[.events|length, ([.events[]|select(.status.type.completed)]|length)]'; done
          echo "== status distintos"; curl -s "$E/scoreboard?dates=202611&limit=500" | jq -c '[.events[].status.type.name] | unique'
          echo "== standings notes"; curl -s "https://site.api.espn.com/apis/v2/sports/soccer/bra.2/standings" | jq -c '[.children[0].standings.entries[] | {t: .team.displayName, n: .note}]' | cut -c1-2000
