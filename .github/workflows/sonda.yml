# Temporário: testa público na Wikipédia. Apagar depois.
name: Sonda de fontes
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Testar
        run: |
          set +e
          UA="brasileirao-2026 (github.com/goncalvesj081-bit/brasileirao-2026)"
          P="Campeonato_Brasileiro_de_Futebol_de_2026_-_S%C3%A9rie_A"
          S=$(curl -s -A "$UA" "https://pt.wikipedia.org/w/api.php?action=parse&page=$P&prop=sections&format=json&redirects=1" | jq -r '[.parse.sections[] | select(.line=="Público")][0].index')
          echo "== secao $S"; curl -s -A "$UA" "https://pt.wikipedia.org/w/api.php?action=parse&page=$P&prop=wikitext&section=$S&format=json&formatversion=2&redirects=1" | jq -r '.parse.wikitext' > pub.txt
          wc -c pub.txt; head -c 3500 pub.txt; echo; echo ...; tail -c 1500 pub.txt
          T="2026_Campeonato_Brasileiro_S%C3%A9rie_A"
          echo "== en secoes"; curl -s -A "$UA" "https://en.wikipedia.org/w/api.php?action=parse&page=$T&prop=sections&format=json" | jq -c '[.parse.sections[] | .line]'
