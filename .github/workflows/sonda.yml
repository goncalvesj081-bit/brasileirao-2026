# Temporário: testa boletins da CBF (com tempo limite) e temporadas passadas na ESPN. Apagar depois.
name: Sonda de fontes
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: ESPN temporadas passadas
        run: |
          E=https://site.api.espn.com/apis/site/v2/sports/soccer/bra.1
          for m in 202505 202411 202306 202206; do echo "== espn $m"; curl -s -m 20 "$E/scoreboard?dates=$m&limit=500" | jq -c '{n: (.events|length), um: (.events[0] | {date, season: .season.slug, st: .status.type.name, c: [.competitions[0].competitors[] | [.homeAway, .team.displayName, .score]]})}'; done
      - name: CBF
        continue-on-error: true
        run: |
          set +e
          for n in 261 300; do
            echo "== boletim $n"; curl -s -m 25 -o b.pdf -w "%{http_code} %{content_type} %{size_download}\n" "https://conteudo.cbf.com.br/sumulas/2026/142${n}b.pdf"
          done
          echo "== dns/conexão"; curl -s -m 15 -o /dev/null -w "%{http_code} %{time_connect}\n" https://www.cbf.com.br/
          echo "== api cbf"; curl -s -m 15 -o /dev/null -w "%{http_code}\n" "https://www.cbf.com.br/futebol-brasileiro/tabelas/campeonato-brasileiro/serie-a/2026"
