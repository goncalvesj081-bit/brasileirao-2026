# Temporário: testa fontes automáticas de técnicos e assistências. Apagar depois.
name: Sonda de fontes
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Testar
        run: |
          set +e
          E=https://site.api.espn.com/apis/site/v2/sports/soccer/bra.1
          echo "== atleta chaves"; curl -s "$E/statistics" | jq -c '.stats[1].leaders[0].athlete | del(.links) | with_entries(.value |= (tostring | .[0:150]))'
          UA="brasileirao-2026 (github.com/goncalvesj081-bit/brasileirao-2026)"
          P="Campeonato_Brasileiro_de_Futebol_de_2026_-_S%C3%A9rie_A"
          for S in 7 19; do
            echo "== pt wikitext secao $S"; curl -s -A "$UA" "https://pt.wikipedia.org/w/api.php?action=parse&page=$P&prop=wikitext&section=$S&format=json&formatversion=2" | jq -r '.parse.wikitext' | head -c 5000; echo
          done
          T="2026_Campeonato_Brasileiro_S%C3%A9rie_A"
          for S in 4 5; do
            echo "== en wikitext secao $S"; curl -s -A "$UA" "https://en.wikipedia.org/w/api.php?action=parse&page=$T&prop=wikitext&section=$S&format=json&formatversion=2" | jq -r '.parse.wikitext' | head -c 4000; echo
          done
