# Temporário: testa público nas páginas de temporada dos clubes na Wikipédia. Apagar depois.
name: Sonda de fontes
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Testar
        run: |
          set +e
          UA="brasileirao-2026 (github.com/goncalvesj081-bit/brasileirao-2026)"
          for C in "Flamengo" "Palmeiras" "Corinthians" "Mirassol" "Chapecoense" "Remo" "Bahia" "Fluminense"; do
            Q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "2026 $C season")
            T=$(curl -s -A "$UA" "https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=$Q&srlimit=1&format=json" | jq -r '.query.search[0].title')
            W=$(curl -s -A "$UA" "https://en.wikipedia.org/w/api.php?action=parse&page=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$T")&prop=wikitext&format=json&formatversion=2" | jq -r '.parse.wikitext')
            N=$(echo "$W" | grep -ciE "attendance *= *[0-9]")
            echo "== $C -> $T : $N jogos com público"
            echo "$W" | grep -iE "attendance *= *[0-9]" | head -2
          done
          T="Clube de Regatas do Flamengo em 2026"
          echo "== pt busca"; curl -s -A "$UA" "https://pt.wikipedia.org/w/api.php?action=query&list=search&srsearch=Temporada%20do%20Flamengo%202026&srlimit=3&format=json" | jq -c '[.query.search[].title]'
