# Temporário: testa fontes automáticas de técnicos e assistências. Apagar depois.
name: Sonda de fontes
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - name: Testar
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          set +e
          E=https://site.api.espn.com/apis/site/v2/sports/soccer/bra.1
          echo "== times ESPN"; curl -s $E/teams | jq -c '[.sports[0].leagues[0].teams[].team | {id, displayName}]'
          ID=$(curl -s $E/teams | jq -r '.sports[0].leagues[0].teams[] | select(.team.displayName|test("Cruzeiro")) | .team.id')
          echo "== roster chaves"; curl -s "$E/teams/$ID/roster" | jq -c 'keys'
          echo "== roster coach"; curl -s "$E/teams/$ID/roster" | jq -c '.coach'
          echo "== roster atleta exemplo"; curl -s "$E/teams/$ID/roster" | jq -c '.athletes[0] | {displayName, statistics: (.statistics|tostring|.[0:600])}'
          echo "== team chaves"; curl -s "$E/teams/$ID" | jq -c '.team | keys'
          echo "== team coach?"; curl -s "$E/teams/$ID" | jq -c '.team.coaches // .team.coach // "nada"'
          echo "== statistics site"; curl -s "$E/statistics" | jq -c '{keys: keys, stats: (.stats // [] | map({name, n: (.leaders|length), primeiro: .leaders[0].athlete.displayName, v: .leaders[0].displayValue}))}' | cut -c1-1500
          echo "== core leaders"; curl -s "https://sports.core.api.espn.com/v2/sports/soccer/leagues/bra.1/seasons/2026/types/1/leaders" | jq -c '{keys: keys, cats: (.categories // [] | map({name, n: (.leaders|length), a: .leaders[0].athlete["$ref"], v: .leaders[0].value}))}' | cut -c1-1500
          echo "== byathlete"; curl -s "https://site.web.api.espn.com/apis/common/v3/sports/soccer/bra.1/statistics/byathlete?season=2026&limit=5" | jq -c '{keys: keys, cats: .categories, um: .athletes[0]}' | cut -c1-1500
          echo "== core coaches"; curl -s "https://sports.core.api.espn.com/v2/sports/soccer/leagues/bra.1/seasons/2026/teams/$ID/coaches" | jq -c '.' | cut -c1-800
          echo "== fd scorers limit 300"; curl -s -H "X-Auth-Token: $FOOTBALL_DATA_KEY" "https://api.football-data.org/v4/competitions/BSA/scorers?season=2026&limit=300" | jq -c '{n: (.scorers|length), comAst: ([.scorers[]|select((.assists//0)>0)]|length), maxAst: ([.scorers[].assists//0]|max)}'
          echo "== fd coaches"; curl -s -H "X-Auth-Token: $FOOTBALL_DATA_KEY" "https://api.football-data.org/v4/competitions/BSA/teams?season=2026" | jq -c '[.teams[] | {t: .shortName, c: .coach.name, s: .coach.contract.start}]'
