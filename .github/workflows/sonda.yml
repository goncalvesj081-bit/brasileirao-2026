# Temporário: testa público no Transfermarkt. Apagar depois.
name: Sonda de fontes
on: workflow_dispatch
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Testar
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for S in 2025 2026; do
            U="https://www.transfermarkt.com.br/campeonato-brasileiro-serie-a/besucherzahlen/wettbewerb/BRA1/saison_id/$S"
            echo "== $S"; curl -s -m 20 -A "$UA" -o tm.html -w "%{http_code} %{size_download}\n" "$U"
            grep -o 'title="[^"]*"[^>]*>[^<]*</a>' tm.html | head -5
            sed -e 's/<[^>]*>/ /g' tm.html | tr -s ' ' | grep -iE "m[ée]dia|Flamengo|Palmeiras|Corinthians" | head -12
          done
